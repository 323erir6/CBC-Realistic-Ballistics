name: High altitude virtual flight validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../_deps_CreateBigCannons ../_deps_sable_2_0_5 ../_deps_sable
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          req = urllib.request.Request(
              'https://api.modrinth.com/v2/version/bOiDu0LS',
              headers={'User-Agent': 'CBC-Realistic-Ballistics-GitHub-Actions/1.4'}
          )
          with urllib.request.urlopen(req) as response:
              version = json.load(response)
          files = version.get('files') or []
          selected = next((f for f in files if f.get('filename') == 'createbigcannons-5.11.7+mc.1.21.1.jar'),
                          next((f for f in files if f.get('primary')), files[0] if files else None))
          if selected is None:
              raise SystemExit('CBC 5.11.7 not found')
          urllib.request.urlretrieve(selected['url'], '../_deps_CreateBigCannons/createbigcannons-5.11.7+mc.1.21.1.jar')

          ponder = 'https://maven.createmod.net/net/createmod/ponder/ponder-neoforge/1.0.82+mc1.21.1/ponder-neoforge-1.0.82+mc1.21.1.jar'
          urllib.request.urlretrieve(ponder, '../_deps_CreateBigCannons/ponder-neoforge-1.0.82+mc1.21.1.jar')

          params = urllib.parse.urlencode({'game_versions': json.dumps(['1.21.1']), 'loaders': json.dumps(['neoforge'])})
          req = urllib.request.Request('https://api.modrinth.com/v2/project/sable/version?' + params,
                                       headers={'User-Agent': 'CBC-Realistic-Ballistics-GitHub-Actions/1.4'})
          with urllib.request.urlopen(req) as response:
              versions = json.load(response)
          sable = next((v for v in versions if str(v.get('version_number', '')).startswith('2.0.5')), None)
          if sable is None:
              raise SystemExit('Sable 2.0.5 not found')
          files = sable.get('files') or []
          selected = next((f for f in files if f.get('primary')), files[0] if files else None)
          if selected is None:
              raise SystemExit('Sable 2.0.5 file missing')
          urllib.request.urlretrieve(selected['url'], '../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar')
          PY
          COMPANION="$(jar tf ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar | grep 'META-INF/jarjar/sable-companion-common-1.21.1-.*\.jar' | head -n1)"
          test -n "$COMPANION"
          (cd ../_deps_sable && jar xf ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar "$COMPANION")
          mkdir -p ../_deps_sable/META-INF/jarjar
          if [ "$COMPANION" != 'META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar' ]; then
            cp "../_deps_sable/$COMPANION" ../_deps_sable/META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar
          fi
          test -f ../_deps_sable/META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar

      - name: Apply requested patch
        run: python3 .github/apply_high_altitude_virtual_flight.py

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build 2>&1 | tee high-altitude-build.log

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/cbc-realistic-ballistics-1.4.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'ua/ivan/cbcrealisticballistics/HighAltitudeProjectileManager.class'
          jar tf "$JAR" | grep -q 'ua/ivan/cbcrealisticballistics/SableHighAltitudeCollision.class'
          grep -q 'BYPASS_ALTITUDE = 350.0' src/main/java/ua/ivan/cbcrealisticballistics/HighAltitudeProjectileManager.java
          grep -q 'start.y > HighAltitudeProjectileManager.BYPASS_ALTITUDE' src/main/java/ua/ivan/cbcrealisticballistics/ProjectileChunkLoader.java

      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties build.gradle.kts src/main high-altitude-build.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add chunkless high-altitude projectile flight'
          git push origin HEAD:${{ github.head_ref }}
